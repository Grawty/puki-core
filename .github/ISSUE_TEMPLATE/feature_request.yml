name: Feature request
description: An example or a core feature you would like to see
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in a template
      description: Would most bots need it, or is it an example of a discord.js feature that is easy to get wrong?
